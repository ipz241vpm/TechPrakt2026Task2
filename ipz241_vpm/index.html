<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новини Житомирщини</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="container">
        <h1>Стрічка актуальних новин</h1>
        <p>Головні події нашого регіону</p>
    </div>
</header>

<main class="container">
    <div class="news-grid" id="newsGrid">
        <article class="news-card">
            <img src="images/img_1.jpg" alt="Оновлений міський сквер">
            <div class="news-content">
                <h2>У центрі міста завершили реконструкцію відпочинкового скверу</h2>
                <p class="news-date">14 Червня, 2026</p>
                <p>У межах планового благоустрою на території облаштували нові пішохідні доріжки, встановили енергоощадне освітлення, сучасні лавки та висадили декоративні кущі.</p>
            </div>
        </article>
    </div>
</main>
</body>
</html>
